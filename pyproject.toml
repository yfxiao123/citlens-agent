[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citlens-agent"
version = "0.1.0"
description = "CiteLens for AI agents: high-recall literature search and citation-grounded survey tools behind one MCP server — no LLM key required."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CiteLens contributors" }]
keywords = [
    "literature-review", "systematic-review", "mcp", "model-context-protocol",
    "academic-search", "citation", "agent-tools",
]
# Deliberately tiny and LLM-free: the calling agent is the model.
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "arxiv>=2.0",
    "markitdown[pdf]>=0.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
citlens-agent = "citlens_mcp:console_main"

[project.urls]
Homepage = "https://github.com/yfxao123/citlens-agent"
Engine = "https://github.com/yfxao123/citens"

[tool.setuptools]
py-modules = ["citlens_mcp"]

[tool.setuptools.packages.find]
include = ["citens*"]

[tool.ruff]
line-length = 100
target-version = "py310"
